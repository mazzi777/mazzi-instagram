name: Testes do publicador e do agente

# A cada push: testes do publicador e validação das semanas que ainda vão sair.
# Se a rotina subir uma semana com erro, o GitHub avisa na hora (e-mail), não no dia de publicar.
on:
  push:
    paths: ["publicar/**", "semanas/**", "agente/**", "package.json", "package-lock.json", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test publicar/publicar.test.mjs
      # Sem baixar o ffmpeg-static e com nova tentativa em falha passageira (.github/instalar-dependencias.sh).
      - name: Dependências
        run: bash .github/instalar-dependencias.sh
      # Antes dos testes do agente: sem o ffmpeg-static, eles usam o ffmpeg/ffprobe do sistema, como o agente no Actions.
      - name: ffmpeg e ffprobe
        run: command -v ffmpeg && command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Testes do agente
        run: npm run test:agente
      - name: Semanas que ainda vão sair
        run: node publicar/validar.mjs --futuras

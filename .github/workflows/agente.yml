name: Agente do Instagram

# O "funcionário" do @mazzisystems (SPEC.md). Produz; quem publica é o workflow "Publicar no Instagram".
#   sábado 02:17 (Brasília)  semanal: atualiza a base do produto, planeja e produz a semana seguinte
#   todo dia 03:17, 11:17 e 16:17  diário: métricas, produz/regera o que falta para os próximos 3 dias e confere os tokens
#   todo dia 20:10           stories: só as métricas dos stories do dia (a Meta apaga em 24 h); não usa o Claude
#
# O diário roda 3 vezes porque o GitHub atrasa (até 8 h) e às vezes descarta rodadas agendadas. Repetir é seguro:
# ele só produz peça que ainda não está na agenda nem foi pulada, as métricas não são coletadas duas vezes
# (chave media_id|idade|dia) e o planejamento só acontece se o plano.json da semana não existe. Sem nada a
# fazer, a rodada não chama o Claude. A concorrência "agente" impede duas rodadas ao mesmo tempo.
# Horário: o cron do GitHub é em UTC; Brasília é UTC−3 fixo (sem horário de verão desde 2019). O minuto não é
# garantido: o GitHub pode começar a rodada bem depois do pedido.
#
# Variáveis do repositório (Settings › Variables), o kill switch:
#   AGENTE_PAUSADO = true      pausa tudo (o publicador também respeita)
#   AGENTE_MODO    = ensaio    produz em ensaio/ (o publicador não lê) | so_reserva | vazio = real
# Segredos: CLAUDE_CODE_OAUTH_TOKEN (assinatura), META_TOKEN e IG_USER_ID (só leitura das métricas), AJ_CLINIC_DEPLOY_KEY (leitura do aj-clinic),
#           TRILHAS_DEPLOY_KEY (leitura do repositório privado mazzi-trilhas: músicas do Pixabay, que não podem ficar públicas),
#           HEARTBEAT_URL (opcional: vigia que avisa se o agente parar de rodar).

on:
  schedule:
    - cron: "17 5 * * 6"   # sábado 02:17 em Brasília
    - cron: "17 6,14,19 * * *" # todo dia 03:17, 11:17 e 16:17 em Brasília (diário)
    - cron: "10 23 * * *"  # todo dia 20:10 em Brasília (métricas dos stories)
  workflow_dispatch:
    inputs:
      comando:
        description: "semanal, diario ou stories"
        type: choice
        options: [semanal, diario, stories]
        default: diario
      semana:
        description: "Só no semanal: segunda-feira futura a produzir (AAAA-MM-DD), para adiantar"
        required: false
        default: ""
      hoje:
        description: "Fingir que hoje é (AAAA-MM-DD), só para teste (as métricas usam a data real)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: agente
  cancel-in-progress: false

jobs:
  # Pausado: não produz nada, mas avisa o vigia que está vivo (silêncio por pausa não é alarme).
  pausado:
    if: vars.AGENTE_PAUSADO == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          echo "Agente pausado (AGENTE_PAUSADO=true). Nada é produzido."
          if [ -n "$HEARTBEAT_URL" ]; then curl -fsS -m 10 --retry 3 "$HEARTBEAT_URL" > /dev/null || true; fi

  agente:
    if: vars.AGENTE_PAUSADO != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AGENTE_MODO: ${{ vars.AGENTE_MODO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Qual rodada
        id: qual
        run: |
          c="${{ inputs.comando }}"
          if [ -z "$c" ]; then
            case "${{ github.event.schedule }}" in
              "17 5 * * 6") c=semanal ;;
              "10 23 * * *") c=stories ;;
              *) c=diario ;;
            esac
          fi
          echo "comando=$c" >> "$GITHUB_OUTPUT"
          echo "Rodada: $c (modo: ${AGENTE_MODO:-real})"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Sem baixar o ffmpeg-static (o ffmpeg vem do apt logo abaixo) e com nova tentativa em falha passageira.
      - name: Dependências
        run: bash .github/instalar-dependencias.sh

      - name: Chromium (captura das imagens)
        if: steps.qual.outputs.comando != 'stories'
        run: npx playwright install --with-deps chromium

      # Reel narrado: ffmpeg (acabamento e medidas), Whisper (legenda sincronizada) e o navegador do Remotion.
      - name: ffmpeg
        if: steps.qual.outputs.comando != 'stories'
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - uses: actions/setup-python@v5
        if: steps.qual.outputs.comando != 'stories'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente/ferramentas/requisitos.txt

      - name: Whisper (faster-whisper)
        if: steps.qual.outputs.comando != 'stories'
        run: pip install -q -r agente/ferramentas/requisitos.txt

      - name: Cache do modelo do Whisper e do navegador do Remotion
        if: steps.qual.outputs.comando != 'stories'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            node_modules/.remotion
          key: video-${{ runner.os }}-whisper-small-remotion-4.0.539

      - name: Clonar o aj-clinic (só leitura, para as novidades do produto)
        if: steps.qual.outputs.comando == 'semanal'
        env:
          CHAVE: ${{ secrets.AJ_CLINIC_DEPLOY_KEY }}
        run: |
          if [ -z "$CHAVE" ]; then echo "Sem AJ_CLINIC_DEPLOY_KEY: a base não será atualizada."; exit 0; fi
          mkdir -p ~/.ssh && printf '%s\n' "$CHAVE" > ~/.ssh/aj_clinic && chmod 600 ~/.ssh/aj_clinic
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aj_clinic -o StrictHostKeyChecking=accept-new" \
            git clone -q --depth 1 git@github.com:mazzi777/aj-clinic.git "$RUNNER_TEMP/aj-clinic"
          rm -f ~/.ssh/aj_clinic
          echo "AJ_CLINIC_DIR=$RUNNER_TEMP/aj-clinic" >> "$GITHUB_ENV"

      - name: Clonar as trilhas (repositório privado, só leitura)
        if: steps.qual.outputs.comando != 'stories'
        env:
          CHAVE: ${{ secrets.TRILHAS_DEPLOY_KEY }}
        run: |
          if [ -z "$CHAVE" ]; then echo "Sem TRILHAS_DEPLOY_KEY: reels saem só com voz e efeitos."; exit 0; fi
          mkdir -p ~/.ssh && printf '%s\n' "$CHAVE" > ~/.ssh/trilhas && chmod 600 ~/.ssh/trilhas
          GIT_SSH_COMMAND="ssh -i ~/.ssh/trilhas -o StrictHostKeyChecking=accept-new" \
            git clone -q --depth 1 git@github.com:mazzi777/mazzi-trilhas.git "$RUNNER_TEMP/trilhas"
          rm -f ~/.ssh/trilhas
          echo "TRILHAS_DIR=$RUNNER_TEMP/trilhas" >> "$GITHUB_ENV"

      - name: Rodar o agente
        id: agente
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          AGENTE_HOJE: ${{ inputs.hoje }}
          AGENTE_SEMANA: ${{ inputs.semana }}
        run: node agente/agente.mjs ${{ steps.qual.outputs.comando }}

      # Roda mesmo se o agente falhar: o que foi produzido e o registro do que reprovou ficam guardados.
      - name: Guardar o que foi produzido
        id: guardar
        if: always() && steps.agente.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in semanas registro uso ensaio metricas estrategia reserva relatorios agente/base/produto.json; do if [ -e "$p" ]; then git add -A -- "$p"; fi; done
          if git diff --cached --quiet; then echo "Nada novo para guardar."; exit 0; fi
          git commit -q -m "Agente: rodada ${{ steps.qual.outputs.comando }} de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin main; then
              git push -q origin HEAD:main && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((i * 5))
          done
          echo "::error::Não consegui guardar o que o agente produziu."
          exit 1

      # O vigia (heartbeat) é um só e quem pinga é o agente; aqui o agente confere que o publicador também está rodando.
      - name: Publicador vivo?
        id: publicador
        if: always() && steps.agente.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ultima=$(gh run list -R "$GITHUB_REPOSITORY" -w publicar.yml -L 1 --json createdAt -q '.[0].createdAt')
          if [ -z "$ultima" ]; then echo "Publicador nunca rodou?"; exit 0; fi
          horas=$(( ( $(date -u +%s) - $(date -u -d "$ultima" +%s) ) / 3600 ))
          echo "Última rodada do publicador: $ultima (há ${horas} h)"
          if [ "$horas" -gt 30 ]; then
            printf '### publicador parado\n\nO workflow "Publicar no Instagram" não roda há %s horas (última: %s). Confira em Actions se ele foi desativado.\n' "$horas" "$ultima" > agente/erros.md
            exit 1
          fi

      - name: Vigia (heartbeat)
        if: always() && steps.agente.outcome == 'success' && steps.guardar.outcome == 'success'
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: if [ -n "$HEARTBEAT_URL" ]; then curl -fsS -m 10 --retry 3 "$HEARTBEAT_URL" > /dev/null && echo "Vigia avisado."; fi

      - name: Avisar a falha num issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENTE: ${{ steps.agente.outcome }}
        run: |
          titulo="Agente do Instagram: problema"
          if [ -f agente/erros.md ]; then detalhe="$(cat agente/erros.md)"
          elif [ "$AGENTE" = "success" ]; then detalhe="O agente rodou, mas não consegui guardar o que ele produziu no repositório (commit/push). A produção desta rodada pode ter se perdido. Veja a rodada."
          else detalhe="Um passo falhou antes do agente rodar (instalação ou checkout). Veja a rodada."; fi
          corpo="$detalhe

          Rodada: $RUN_URL"
          num=$(gh issue list --state open --author "app/github-actions" --search "\"$titulo\" in:title" --json number -q '.[0].number')
          if [ -z "$num" ]; then gh issue create --title "$titulo" --body "$corpo"; exit 0; fi
          # Com o diário 3x por dia, o mesmo problema se repetiria a cada rodada: só comenta quando o motivo muda.
          ultimo=$(gh issue view "$num" --json body,comments -q 'if (.comments | length) > 0 then .comments[-1].body else .body end')
          if [[ "$ultimo" == *"$detalhe"* ]]; then echo "Mesmo motivo do último aviso (#$num): não comento de novo."; exit 0; fi
          gh issue comment "$num" --body "$corpo"

      # SPEC 9: quando a rodada passa limpa, o aviso aberto do agente é fechado com "resolvido" (o GitHub manda o e-mail).
      - name: Fechar aviso resolvido
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          num=$(gh issue list --state open --author "app/github-actions" --search "\"Agente do Instagram: problema\" in:title" --json number -q '.[0].number')
          if [ -n "$num" ]; then gh issue close "$num" --comment "Resolvido: a rodada seguinte passou sem erro ($RUN_URL)."; fi

name: Publicar no Instagram

# De hora em hora, das 07:40 às 22:40 de Brasília: confere a chave da Meta, publica no @mazzisystems as
# peças do dia cujo horário já chegou (ou atrasadas até 2 dias) de semanas/*/agenda.json e grava o registro.
# Semana da rotina (sem horário) sai na primeira rodada do dia.
#
# Por que de hora em hora: o GitHub atrasa (2 a 8 h) e às vezes descarta rodadas agendadas. Com 4 rodadas
# por dia, só 2 aconteciam (por volta de 15:00 e 22:45) e as peças saíam horas depois do horário. Rodar mais
# vezes NÃO adianta nada: o publicador só pega peça cujo dia chegou e cujo "horario" já passou
# (escolherPecas), nunca repete o que está em publicado.json, faz no máximo 1 post de feed por dia, e a
# concorrência "publicar" impede duas rodadas ao mesmo tempo.
# Janela 07:40–22:40: igual à de antes para peça sem horário e para atrasada (nada de madrugada).
#
# Horário: o cron do GitHub é sempre em UTC. Brasília é UTC−3 fixo (sem horário de verão desde 2019);
# se o horário de verão voltar, a janela anda 1 h e este cron precisa ser ajustado. O GitHub também não
# garante o minuto exato: "40" é o pedido, a rodada pode começar bem depois (ou ser descartada).
# Kill switch: variável AGENTE_PAUSADO=true (Settings › Variables) e nada é publicado. Em QUALQUER falha, abre
# (ou comenta) o issue "Instagram: falha ao publicar" e o GitHub avisa a Andressa por e-mail.
#
# Segredos (Settings › Secrets and variables › Actions):
#   META_TOKEN  token sem validade do usuário do sistema "mazzi-publicador" (portfólio Mazzi Systems)
#   IG_USER_ID  17841452348726895

on:
  schedule:
    - cron: "40 0,1,10-23 * * *" # 07:40 a 22:40 de Brasília (10:40–23:40 e 00:40–01:40 UTC), de hora em hora
  workflow_dispatch:
    inputs:
      peca:
        description: "Uma peça só, ex.: 2026-11-09/S1 (vazio = as do dia)"
        required: false
        default: ""
      simular:
        description: "Só conferir, sem publicar"
        type: boolean
        default: true
      conferir:
        description: "Só testar a chave da Meta (mostra a conta), sem olhar a agenda"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # A Meta baixa as mídias deste commit exato (não de "main", que pode mudar ou estar em cache).
      - name: Commit das mídias
        run: echo "MIDIA_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ffprobe (mede o vídeo do reel)
        run: command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Testes do publicador
        run: node --test publicar/publicar.test.mjs

      # Se uma rodada publicou mas não conseguiu gravar o publicado.json (aviso "não foi gravado" aberto),
      # o git não sabe o que saiu: com rodadas de hora em hora, a próxima repetiria stories. Trava até alguém
      # conferir no Instagram, registrar e fechar o aviso. Não falha a rodada (o aviso já está aberto).
      - name: Registro pendente de conferência?
        id: trava
        if: github.event.inputs.conferir != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --author "app/github-actions" --search "\"Instagram: falha ao publicar\" in:title" --json number -q '.[0].number')
          if [ -n "$num" ] && gh issue view "$num" -R "$GITHUB_REPOSITORY" --json body,comments -q '.body, .comments[].body' | grep -q "não foi gravado"; then
            echo "bloqueado=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Publicação travada: o aviso #$num diz que um registro não foi gravado. Confira no Instagram, registre em publicado.json e feche o aviso."
          fi

      - name: Publicar
        id: publicar
        if: steps.trava.outputs.bloqueado != 'true'
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PECA: ${{ inputs.peca }}
          SIMULAR: ${{ inputs.simular }}
          CONFERIR: ${{ inputs.conferir }}
          AGENTE_PAUSADO: ${{ vars.AGENTE_PAUSADO }}
        run: |
          if [ "$CONFERIR" = "true" ]; then node publicar/publicar.mjs --conferir; exit $?; fi
          args=()
          if [ -n "$PECA" ]; then args+=(--peca "$PECA"); fi
          if [ "$SIMULAR" = "true" ]; then args+=(--simular); fi
          node publicar/publicar.mjs "${args[@]}"

      # Roda mesmo se a publicação falhar ou o job for cancelado: o "pendente" gravado antes de
      # cada media_publish é o que impede post duplicado na próxima rodada.
      - name: Guardar o que foi publicado
        id: guardar
        if: always() && steps.publicar.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- semanas guia/log.md
          if git diff --cached --quiet; then echo "Nada novo para guardar."; exit 0; fi
          git commit -q -m "Instagram: registro da publicação de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q origin main; then
              git push -q origin HEAD:main && exit 0
            else
              git rebase --abort || true
            fi
            sleep $((i * 5))
          done
          echo "::error::Não consegui gravar o publicado.json."
          exit 1

      - name: Avisar a falha num issue
        if: failure() && github.event.inputs.simular != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GUARDAR: ${{ steps.guardar.outcome }}
        run: |
          titulo="Instagram: falha ao publicar"
          if [ -f publicar/erros.md ]; then detalhe="$(cat publicar/erros.md)"; else detalhe="Um passo falhou antes de publicar (instalação, testes ou checkout). Nada foi publicado; veja a rodada."; fi
          if [ "$GUARDAR" = "failure" ]; then
            detalhe="$detalhe

          **ATENÇÃO: o registro (publicado.json) não foi gravado.** A publicação fica travada até alguém conferir no Instagram o que saiu hoje, registrar em publicado.json (o Claude faz) e fechar este aviso; senão stories podem sair repetidos."
          fi
          corpo="$detalhe

          Rodada: $RUN_URL"
          num=$(gh issue list --state open --author "app/github-actions" --search "\"$titulo\" in:title" --json number -q '.[0].number')
          if [ -z "$num" ]; then gh issue create --title "$titulo" --body "$corpo"; exit 0; fi
          # De hora em hora, o mesmo problema se repetiria a cada rodada: só comenta quando o motivo muda.
          ultimo=$(gh issue view "$num" --json body,comments -q 'if (.comments | length) > 0 then .comments[-1].body else .body end')
          if [[ "$ultimo" == *"$detalhe"* ]]; then echo "Mesmo motivo do último aviso (#$num): não comento de novo."; exit 0; fi
          gh issue comment "$num" --body "$corpo"

      # SPEC 9: rodada limpa fecha o aviso aberto com "resolvido". Menos quando o aviso pede ação à mão
      # (registro não gravado): esse fica aberto até alguém conferir.
      - name: Fechar aviso resolvido
        if: success() && github.event.inputs.simular != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          num=$(gh issue list --state open --author "app/github-actions" --search "\"Instagram: falha ao publicar\" in:title" --json number -q '.[0].number')
          [ -n "$num" ] || exit 0
          if gh issue view "$num" --json body,comments -q '.body, .comments[].body' | grep -q "não foi gravado"; then
            echo "O aviso #$num pede conferência à mão: fica aberto."; exit 0
          fi
          gh issue close "$num" --comment "Resolvido: a rodada seguinte publicou sem erro ($RUN_URL). Se o aviso era de peça vencida, ela não sai sozinha."

name: Publicar no Instagram

# Publica as peças do dia de semanas/*/agenda.json no @mazzisystems pela API oficial da Meta.
# Seg/qua/sex às 07:30 de Brasília. Em caso de falha, abre (ou comenta) o issue
# "Instagram: falha ao publicar" e o GitHub avisa a Andressa por e-mail.
#
# Segredos (Settings › Secrets and variables › Actions):
#   META_TOKEN  token sem validade do usuário do sistema "mazzi-publicador" (Gerenciador de Negócios)
#   IG_USER_ID  17841452348726895

on:
  schedule:
    - cron: "30 10 * * 1,3,5"
  workflow_dispatch:
    inputs:
      peca:
        description: "Uma peça só, ex.: 2026-11-09/S1 (vazio = as do dia)"
        required: false
        default: ""
      simular:
        description: "Só conferir, sem publicar"
        type: boolean
        default: true
      conferir:
        description: "Só testar a chave da Meta (mostra a conta), sem olhar a agenda"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ffprobe (mede o vídeo do reel)
        run: command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Testes do publicador
        run: node --test publicar/publicar.test.mjs

      - name: Publicar
        id: publicar
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PECA: ${{ inputs.peca }}
          SIMULAR: ${{ inputs.simular }}
          CONFERIR: ${{ inputs.conferir }}
        run: |
          if [ "$CONFERIR" = "true" ]; then node publicar/publicar.mjs --conferir; exit $?; fi
          args=()
          if [ -n "$PECA" ]; then args+=(--peca "$PECA"); fi
          if [ "$SIMULAR" = "true" ]; then args+=(--simular); fi
          node publicar/publicar.mjs "${args[@]}"

      - name: Guardar o que foi publicado
        if: always() && steps.publicar.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add semanas/*/publicado.json guia/log.md
          if git diff --cached --quiet; then echo "Nada novo para guardar."; exit 0; fi
          git commit -m "Instagram: registro da publicação de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::error::Não consegui gravar o publicado.json — confira antes da próxima rodada para não duplicar."
          exit 1

      - name: Avisar a falha num issue
        if: failure() && steps.publicar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="Instagram: falha ao publicar"
          corpo="$( [ -f publicar/erros.md ] && cat publicar/erros.md || echo 'Erro sem detalhe — ver o log da rodada.')

          Rodada: $RUN_URL"
          num=$(gh issue list --state open --search "\"$titulo\" in:title" --json number -q '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "$corpo"; else gh issue create --title "$titulo" --body "$corpo"; fi
